version: '3.8'

services:
  backend:
    build: ./backend
    container_name: erp-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=super-secret-erp-key
      - DATABASE_URL=file:./dev.db
    volumes:
      - backend-db:/app/prisma

  frontend:
    build: ./frontend
    container_name: erp-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000

volumes:
  backend-db:
